{% extends "base.html" %}

{% block title %}رمز التحقق · إنجاز ستور{% endblock %}

{% block content %}
  <div class="auth-card">
    <h1 class="section-title" style="font-size:1.4rem">أدخل رمز التحقق</h1>
    <p class="helptext" style="margin-bottom:16px">افتح تطبيق المصادقة وأدخل الرمز المكوّن من 6 أرقام الخاص بـ إنجاز ستور.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="form-group">
        <label for="code">رمز التحقق</label>
        <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">تحقّق</button>
    </form>
    <p class="auth-card__footer"><a href="{% url 'accounts:login' %}">&larr; العودة إلى تسجيل الدخول</a></p>
  </div>
{% endblock %}
