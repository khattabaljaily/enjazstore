<p class="text-muted" style="margin-bottom:14px;font-size:0.88rem;">
  جارٍ تعيين كلمة مرور جديدة لـ <strong>{{ employee.username }}</strong>. لن يحتاج إلى كلمة مروره القديمة.
</p>

<form method="post" action="{{ request.path }}">
  {% csrf_token %}
  <div class="form-group">
    <label for="{{ form.new_password1.id_for_label }}">كلمة المرور الجديدة</label>
    {{ form.new_password1 }}
    {% for error in form.new_password1.errors %}<p class="form-errors">{{ error }}</p>{% endfor %}
  </div>
  <div class="form-group">
    <label for="{{ form.new_password2.id_for_label }}">تأكيد كلمة المرور الجديدة</label>
    {{ form.new_password2 }}
    {% for error in form.new_password2.errors %}<p class="form-errors">{{ error }}</p>{% endfor %}
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary btn-sm">تعيين كلمة المرور</button>
  </div>
</form>
