{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>{% block subject %}إنجاز ستور{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#faf8f5; font-family:'Noto Kufi Arabic',-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#faf8f5;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" dir="rtl" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 12px 28px -8px rgba(20, 18, 15,0.16);">

          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#0a0906 0%,#2b2620 100%); padding:32px 40px; text-align:center;">
              <img src="cid:{{ logo_cid }}" width="52" height="52" alt="إنجاز ستور" style="display:block; margin:0 auto 12px; border-radius:50%; background:#ffffff;">
              <span style="font-family:'Noto Kufi Arabic',Arial,sans-serif; font-weight:800; font-size:20px; color:#ffffff; letter-spacing:0.02em;">إنجاز ستور</span>
            </td>
          </tr>

          <!-- Status ribbon -->
          {% block ribbon %}{% endblock %}

          <!-- Content -->
          <tr>
            <td style="padding:36px 40px; color:#14120f; font-size:15px; line-height:1.65; text-align:right;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 40px; background-color:#faf8f5; text-align:center; font-size:12px; color:#7a7266; border-top:1px solid #e7e1d4;">
              <p style="margin:0 0 6px;">إنجاز ستور &middot; السودان</p>
              <p style="margin:0;">للاستفسارات: <a href="mailto:support@enjaztechnology.com" style="color:#14120f; text-decoration:none;">support@enjaztechnology.com</a></p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
