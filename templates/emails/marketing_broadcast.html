{% extends "emails/base_email.html" %}

{% block subject %}{{ subject }}{% endblock %}

{% block content %}
{% for paragraph in paragraphs %}
<p style="margin:0 0 16px; color:#15262b;">{{ paragraph }}</p>
{% endfor %}

<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px auto 0;">
  <tr>
    <td style="border-radius:8px; background-color:#4338ca;">
      <a href="{{ shop_url }}" style="display:inline-block; padding:12px 28px; font-family:'Cairo',Arial,sans-serif; font-weight:700; font-size:14px; color:#ffffff; text-decoration:none;">تسوّق الآن</a>
    </td>
  </tr>
</table>
{% endblock %}
